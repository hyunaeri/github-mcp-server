<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">github-mcp-server architecture diagram</title>
  <desc id="desc">AnythingLLM Desktop communicates with Ollama and the GitHub MCP Server.</desc>
  <defs>
    <style>
      .bg { fill: #f5f5f5; }
      .panel { fill: #f1f1f1; stroke: #d8d8d8; stroke-width: 1.5; }
      .card { fill: #ffffff; stroke: #d0d0d0; stroke-width: 1.5; }
      .title { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 700; fill: #222; }
      .subtitle { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 500; fill: #5a5a5a; }
      .body { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 500; fill: #333; }
      .muted { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 400; fill: #666; }
      .arrow { font-family: Inter, Arial, Helvetica, sans-serif; font-weight: 700; fill: #555; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="480" rx="24"></rect>
  <rect class="panel" x="10" y="10" width="1180" height="460" rx="22"></rect>

  <rect class="panel" x="38" y="48" width="1124" height="108" rx="22"></rect>
  <text class="title" x="600" y="105" font-size="30" text-anchor="middle">AnythingLLM Desktop</text>
  <text class="subtitle" x="600" y="138" font-size="22" text-anchor="middle">사용자 대화 + MCP Client</text>

  <text class="arrow" x="310" y="218" font-size="38" text-anchor="middle">⇅</text>
  <text class="arrow" x="890" y="218" font-size="38" text-anchor="middle">⇅</text>

  <rect class="card" x="38" y="246" width="552" height="174" rx="20"></rect>
  <text class="title" x="314" y="304" font-size="32" text-anchor="middle">Ollama</text>
  <text class="body" x="314" y="352" font-size="24" text-anchor="middle">Qwen3.5 4B</text>
  <text class="muted" x="314" y="387" font-size="18" text-anchor="middle">로컬 LLM 추론</text>

  <rect class="card" x="610" y="246" width="552" height="174" rx="20"></rect>
  <text class="title" x="886" y="304" font-size="32" text-anchor="middle">GitHub MCP Server</text>
  <text class="body" x="886" y="352" font-size="24" text-anchor="middle">Java / stdio</text>
  <text class="muted" x="886" y="387" font-size="18" text-anchor="middle">GitHub API 실행</text>
</svg>